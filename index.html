.hp-hidden { margin-top: 16px; border: 1px dashed #cdd5df; border-radius: 6px; padding: 14px 16px 12px; background: repeating-linear-gradient(135deg, #fbfcfd 0 8px, #f6f8fa 8px 16px); }

.hp-result p { margin: 0; font-size: 0.85rem; line-height: 1.45; color: #5a1a14; }

.hp-mock__foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 20px; border-top: 1px solid var(--c-line); background: var(--c-bg-alt); font-size: 0.85rem; color: var(--c-muted); }
.hp-mock__foot a { color: var(--c-accent); font-weight: 600; text-decoration: none; white-space: nowrap; }
.hp-mock__foot a:hover { text-decoration: underline; }
