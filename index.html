<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RatioNova | From Data to Decisions</title>
  <meta name="description" content="RatioNova – üretim planlama, stok optimizasyonu ve karar destek sistemleri. Coming soon, by your side.">
  <link rel="canonical" href="https://rationova.com.tr/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="RatioNova | From Data to Decisions">
  <meta property="og:description" content="From Raw Materials to Finished Products. Coming soon, by your side.">
  <meta property="og:url" content="https://rationova.com.tr/">
  <meta property="og:image" content="https://rationova.com.tr/logo.jpg">
  <meta property="og:locale" content="tr_TR">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600&display=swap">
  <style>
:root {
  --navy: #3d4174;
  --blue: #45497e;
  --teal: #4b5e24;
  --lav: #575b8e;
  --muted: #74779c;
  --bg: #fbfbfd;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  min-height: 100vh; min-height: 100svh;
  display: flex; flex-direction: column;
  background: var(--bg);
  color: var(--navy);
  font-family: "Figtree", "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.stage {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
  align-items: center;
  gap: clamp(32px, 5vw, 80px);
  width: 100%; max-width: 1240px;
  margin: 0 auto;
  padding: clamp(32px, 6vh, 72px) clamp(20px, 5vw, 64px);
}

.brand { margin: 0 0 clamp(14px, 2.4vh, 22px); font-size: clamp(2rem, 3.6vw, 2.9rem); font-weight: 600; letter-spacing: -0.02em; color: #111318; }
.line1 { margin: 0; font-size: clamp(1.15rem, 2.1vw, 1.75rem); font-weight: 300; color: var(--navy); }
.line2 { margin: 0.35em 0 0; font-size: clamp(2.3rem, 4.4vw, 3.9rem); white-space: nowrap; font-weight: 400; line-height: 1.05; letter-spacing: -0.02em; color: var(--teal); }
.areas { margin: clamp(18px, 3vh, 30px) 0 0; font-size: clamp(0.92rem, 1.25vw, 1.1rem); font-weight: 400; color: var(--lav); line-height: 1.6; }
.areas span { white-space: nowrap; }
.areas b { font-weight: 400; margin: 0 0.15em; }

.soon { display: flex; align-items: center; gap: 18px; margin-top: clamp(26px, 4.5vh, 44px); }
.soon::before { content: ""; width: 92px; height: 1.5px; background: var(--teal); flex-shrink: 0; }
.soon p { margin: 0; font-size: clamp(1.05rem, 1.5vw, 1.3rem); font-weight: 500; color: var(--teal); letter-spacing: 0.01em; }

/* Diyagram */
.flow { width: 100%; height: auto; display: block; overflow: visible; }
.flow text { font-family: inherit; }
.rm { font-size: 25px; fill: var(--blue); font-weight: 400; }
.fg { font-size: 29px; fill: #8a8fa8; font-weight: 300; }
.fg.sel { fill: var(--teal); font-weight: 400; }
.note { font-size: 17.5px; fill: var(--teal); }
.cap { font-size: 18px; fill: var(--lav); font-style: italic; }
.edge { fill: none; stroke: #a4a7c8; stroke-width: 1.3; opacity: .55; }
.edge.hi { stroke: var(--teal); stroke-width: 2.2; opacity: 1; }

@media (prefers-reduced-motion: no-preference) {
  .edge { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 1.6s ease-out forwards; }
  .edge:nth-of-type(2) { animation-delay: .1s } .edge:nth-of-type(3) { animation-delay: .2s }
  .edge:nth-of-type(4) { animation-delay: .3s } .edge:nth-of-type(5) { animation-delay: .4s }
  .edge:nth-of-type(6) { animation-delay: .5s } .edge:nth-of-type(7) { animation-delay: .6s }
  .edge.hi { animation-delay: 1s; animation-duration: 1.2s; }
  .check, .sel-note { opacity: 0; animation: fade .6s ease-out 2.1s forwards; }
}
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }

footer { padding: 0 20px 22px; text-align: center; font-size: 0.85rem; color: var(--muted); }
footer a { color: var(--muted); text-decoration: none; border-bottom: 1px solid rgba(116,119,156,.35); }
footer a:hover { color: var(--teal); border-color: var(--teal); }

@media (max-width: 1100px) {
  .line2 { white-space: normal; }
}
@media (max-width: 900px) {
  .stage { grid-template-columns: minmax(0, 1fr); gap: 36px; align-content: center; }
  .areas span { display: block; white-space: normal; }
  .areas b { display: none; }
  .flow { max-width: 520px; margin: 0 auto; }
}
  </style>
</head>
<body>
  <main class="stage">
    <section>
      <h1 class="brand">RatioNova</h1>
      <p class="line1">From Raw Materials to Finished Products</p>
      <p class="line2">From Data to Decisions</p>
      <p class="areas"><span>Production Planning</span> <b>•</b> <span>Inventory Optimization</span> <b>•</b> <span>Decision Support Systems</span></p>
      <div class="soon"><p>Coming soon, by your side.</p></div>
    </section>

    <svg class="flow" viewBox="0 0 700 420" role="img" aria-label="Hammaddelerden ürün alternatiflerine karar diyagramı">
      <path class="edge" d="M150 40 C 310 40, 310 165, 470 165"/>
      <path class="edge" d="M150 40 C 310 40, 310 295, 470 295"/>
      <path class="edge" d="M150 125 C 310 125, 310 50, 470 50"/>
      <path class="edge" d="M150 125 C 310 125, 310 295, 470 295"/>
      <path class="edge" d="M150 225 C 310 225, 310 50, 470 50"/>
      <path class="edge" d="M150 225 C 310 225, 310 295, 470 295"/>
      <path class="edge" d="M150 300 C 310 300, 310 165, 470 165"/>
      <path class="edge hi" d="M150 125 C 310 125, 310 165, 470 165"/>

      <g fill="#45497e">
        <circle cx="150" cy="40" r="5"/><circle cx="150" cy="225" r="5"/><circle cx="150" cy="300" r="5"/>
      </g>
      <circle cx="150" cy="125" r="5" fill="#4b5e24"/>
      <circle cx="470" cy="50" r="5" fill="#8a8fa8"/>
      <circle cx="470" cy="165" r="5.5" fill="#4b5e24"/>
      <circle cx="470" cy="295" r="5" fill="#8a8fa8"/>

      <text class="rm" x="134" y="48" text-anchor="end">RM-001</text>
      <text class="rm" x="134" y="133" text-anchor="end" style="fill:#4b5e24">RM-014</text>
      <text class="note" x="50" y="162">Material under</text>
      <text class="note" x="50" y="184">evaluation</text>
      <text class="rm" x="134" y="233" text-anchor="end">RM-028</text>
      <text class="rm" x="134" y="308" text-anchor="end">RM-042</text>

      <text class="fg" x="488" y="59">FG-101</text>
      <text class="fg sel" x="488" y="174">FG-205</text>
      <g class="check">
        <circle cx="628" cy="163" r="15" fill="#4b5e24"/>
        <path d="M621 163.5 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text class="note sel-note" x="488" y="206">Selected for production</text>
      <text class="fg" x="488" y="304">FG-308</text>

      <text class="cap" x="50" y="390">raw materials</text>
      <text class="cap" x="488" y="390">product alternatives</text>
    </svg>
  </main>

  <footer>
    <a href="mailto:contact@rationova.com.tr">contact@rationova.com.tr</a>
  </footer>
</body>
</html>
